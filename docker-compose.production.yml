services:
  crack-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crackedwall-web
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - crackedwall-evidence:/app/static/images
      - crackedwall-uploads:/app/uploads
      - crackedwall-logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 25s

volumes:
  crackedwall-evidence:
  crackedwall-uploads:
  crackedwall-logs:
