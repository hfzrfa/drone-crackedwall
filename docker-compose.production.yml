services:
  crack-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crackedwall-web
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME}?authSource=${DB_NAME}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - crackedwall-evidence:/app/static/images
      - crackedwall-uploads:/app/uploads
      - crackedwall-logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 25s

  mongo:
    image: mongo:8.0
    container_name: crackedwall-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - crackedwall-mongo:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/01-app-user.js:ro
    restart: unless-stopped
    mem_limit: 400m

volumes:
  crackedwall-evidence:
  crackedwall-uploads:
  crackedwall-logs:
  crackedwall-mongo:
