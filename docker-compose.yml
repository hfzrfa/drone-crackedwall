services:
  crack-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drone-crack-detector
    init: true
    env_file:
      - .env
    environment:
      # Must listen on all container interfaces so the published port works.
      HOST: 0.0.0.0
      # Docker Desktop camera/OBS access is not reliable. Use a mounted video file.
      VIDEO_PATH: ${VIDEO_PATH:-video/vid2.mp4}
      # Override in .env with the laptop LAN URL when Android uses Docker.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5000}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # Add or replace test videos on the host without rebuilding the image.
      - ./video:/app/video:ro
      # Keep detection evidence after the container is recreated.
      - detection-images:/app/static/images
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  detection-images:
